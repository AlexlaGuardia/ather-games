<title>Manalic Gun Sound Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Nunito:wght@400;600&display=swap">
<style>
/* Layout: a row of gun tabs, then one gun's plate: a big FIRE pad and four sound layers as slider groups. Hearth-wood tones. */
:root {
  --bg: #f1ece3; --plate: #fffaf2; --ink: #2e2318; --ink-soft: #6b5238; --rule: #dccfbd; --accent: #8a5a2b; --chip: #f4ede2; --pad: #2f2a26; --pad-ink: #f6e7cf;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif; --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15130f; --plate: #201c16; --ink: #f0e6d6; --ink-soft: #b9a68a; --rule: #3a3227; --accent: #e0a865; --chip: #2a251e; --pad: #e9d9bf; --pad-ink: #2a1f15; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #15130f; --plate: #201c16; --ink: #f0e6d6; --ink-soft: #b9a68a; --rule: #3a3227; --accent: #e0a865; --chip: #2a251e; --pad: #e9d9bf; --pad-ink: #2a1f15; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.45 }
.wrap { max-width: 1080px; margin: 0 auto; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1 { font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 1.3rem; margin: 0 0 4px }
.lede { color: var(--ink-soft); margin: 0 0 16px; max-width: 70ch }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px }
button { font: inherit; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer }
button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: 600 }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.tab { font-family: var(--display); letter-spacing: .1em; text-transform: uppercase; font-size: .8rem }
.gun { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 760px) { .gun { grid-template-columns: 1fr } }
.side { display: grid; gap: 10px }
.pad { background: var(--pad); color: var(--pad-ink); border: none; border-radius: 12px; height: 150px; font-family: var(--display); font-size: 1.4rem; letter-spacing: .2em; text-transform: uppercase; touch-action: none; user-select: none }
.pad:active { transform: scale(.98) }
.note { color: var(--ink-soft); font-size: .86rem; margin: 0 }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; min-width: 0 }
.group { background: var(--plate); border: 1px solid var(--rule); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0 }
.ghead { display: flex; justify-content: space-between; align-items: center }
.label { font-family: var(--display); font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft) }
.row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 52px; gap: 8px; align-items: center; font-size: .84rem }
.row output { font-variant-numeric: tabular-nums; text-align: right; color: var(--ink-soft); font-size: .78rem }
input[type=range] { width: 100%; accent-color: var(--accent) }
.tools { display: flex; flex-wrap: wrap; gap: 6px }
textarea { width: 100%; min-height: 80px; font: 12px ui-monospace, Menlo, monospace; background: var(--chip); color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; box-sizing: border-box }
</style>

<div class="wrap">
  <h1>Manalic gun sound board</h1>
  <p class="lede">No powder, so no bang: each shot is a breath of mana with its own tail. Pick a gun, hit FIRE (hold it on the Spitter), and shape the four layers. Copy settings carries your numbers into the game's gun bench later.</p>
  <div class="tabs" id="tabs"></div>
  <div class="gun">
    <div class="side">
      <button class="pad" id="fire">Fire</button>
      <div class="tools">
        <button id="reload">Reload</button><button id="empty">Empty</button><button id="reset">Reset gun</button><button id="copy">Copy settings</button>
      </div>
      <label class="row" style="grid-template-columns:70px 1fr 52px"><span>Volume</span><input type="range" id="vol" min="0" max="1" step="0.01" value="0.7"><output id="volo">70%</output></label>
      <p class="note" id="desc"></p>
      <textarea id="out" readonly aria-label="Settings for every gun" hidden></textarea>
    </div>
    <div class="groups" id="groups"></div>
  </div>
</div>

<script>
// ── the four layers of a shot. Every value is a number the game's gun bench will read verbatim. ──
const LAYERS = {
  breath: { name: 'Breath', hint: 'the exhale: a puff of filtered air', p: { gain: [0, 1, .01], freq: [200, 4000, 10], q: [0.3, 8, .1], attack: [0.001, 0.05, .001], decay: [0.02, 0.6, .005] } },
  sizzle: { name: 'Sizzle', hint: 'crackling mana, like water on a hot pan', p: { gain: [0, 1, .01], freq: [1500, 9000, 10], crackle: [0, 1, .01], decay: [0.02, 1.2, .01] } },
  ring:   { name: 'Ring', hint: 'the crystal: a bright tone that rings out', p: { gain: [0, 1, .01], freq: [300, 4000, 5], shimmer: [0, 30, .5], decay: [0.02, 1.5, .01] } },
  thump:  { name: 'Thump', hint: 'body: a low drop under the shot', p: { gain: [0, 1, .01], from: [40, 400, 1], to: [20, 200, 1], decay: [0.02, 0.5, .005] } },
}
const GUNS = {
  repeater: { name: 'Repeater', desc: 'Sidearm. A soft pff with a tiny crystal ping.', rate: 0, charge: 0, v: { breath: { gain: .55, freq: 1400, q: 1.2, attack: .003, decay: .09 }, sizzle: { gain: .08, freq: 6000, crackle: .2, decay: .08 }, ring: { gain: .22, freq: 1850, shimmer: 6, decay: .25 }, thump: { gain: .2, from: 180, to: 70, decay: .06 } } },
  spitter: { name: 'Spitter', desc: 'SMG. Rapid tk-tk puffs. Hold FIRE.', rate: 11, charge: 0, v: { breath: { gain: .45, freq: 2400, q: 2.4, attack: .001, decay: .035 }, sizzle: { gain: .05, freq: 7000, crackle: .1, decay: .03 }, ring: { gain: .06, freq: 2600, shimmer: 2, decay: .05 }, thump: { gain: .15, from: 220, to: 120, decay: .025 } } },
  backbone: { name: 'Backbone', desc: 'Longbarrel, 3-round burst. A clipped fwip-fwip-fwip.', rate: 0, burst: 3, burstGap: .075, charge: 0, v: { breath: { gain: .5, freq: 1100, q: 1.6, attack: .002, decay: .07 }, sizzle: { gain: .14, freq: 5200, crackle: .35, decay: .12 }, ring: { gain: .1, freq: 1300, shimmer: 4, decay: .12 }, thump: { gain: .3, from: 160, to: 55, decay: .06 } } },
  roar: { name: 'Roar', desc: 'Breacher. A deep whumph and a long crackling sizzle.', rate: 0, charge: 0, v: { breath: { gain: .8, freq: 520, q: .8, attack: .004, decay: .22 }, sizzle: { gain: .5, freq: 4200, crackle: .75, decay: .65 }, ring: { gain: .05, freq: 700, shimmer: 10, decay: .3 }, thump: { gain: .75, from: 120, to: 35, decay: .2 } } },
  lance: { name: 'Lance', desc: 'Reacher. A sharp tssk and a long fading hiss.', rate: 0, charge: 0, v: { breath: { gain: .4, freq: 3200, q: 3, attack: .001, decay: .05 }, sizzle: { gain: .42, freq: 7600, crackle: .15, decay: .95 }, ring: { gain: .2, freq: 2900, shimmer: 12, decay: .7 }, thump: { gain: .25, from: 260, to: 90, decay: .05 } } },
  'charred-rifle': { name: 'Charred Rifle', desc: 'Kael’s rifle. A mid fwoom and a hiss that rides the round out.', rate: 0, charge: 0, v: { breath: { gain: .65, freq: 900, q: 1, attack: .003, decay: .14 }, sizzle: { gain: .32, freq: 5600, crackle: .25, decay: .55 }, ring: { gain: .14, freq: 1150, shimmer: 8, decay: .4 }, thump: { gain: .45, from: 140, to: 45, decay: .1 } } },
}
const DEFAULTS = JSON.parse(JSON.stringify(GUNS))
let cur = 'repeater', ctx = null, master = null
const audio = () => { if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = +document.getElementById('vol').value; master.connect(ctx.destination) } if (ctx.state === 'suspended') ctx.resume(); return ctx }
let noiseBuf = null
const noise = () => { if (noiseBuf) return noiseBuf; const n = ctx.sampleRate * 1.5; noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; return noiseBuf }
function env(g, t, peak, attack, decay) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay) }
// ONE SHOT: the four layers, each a few nodes, started at time t with a little per-shot variety
function shot(v, t, pitch = 1) {
  const out = master
  if (v.breath.gain > 0) { const s = ctx.createBufferSource(); s.buffer = noise(); s.playbackRate.value = pitch
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = v.breath.freq * pitch; f.Q.value = v.breath.q
    const g = ctx.createGain(); env(g, t, v.breath.gain, v.breath.attack, v.breath.decay); s.connect(f).connect(g).connect(out); s.start(t, Math.random()); s.stop(t + v.breath.attack + v.breath.decay + .05) }
  if (v.sizzle.gain > 0) { const s = ctx.createBufferSource(); s.buffer = noise()
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = v.sizzle.freq * pitch
    const g = ctx.createGain(); env(g, t, v.sizzle.gain, .004, v.sizzle.decay)
    // crackle: chop the hiss with a fast random gate
    const gate = ctx.createGain(); const dur = v.sizzle.decay + .05, steps = Math.ceil(dur / 0.008)
    for (let i = 0; i < steps; i++) gate.gain.setValueAtTime(Math.random() < v.sizzle.crackle ? Math.random() * .3 : 1, t + i * 0.008)
    s.connect(f).connect(gate).connect(g).connect(out); s.start(t, Math.random()); s.stop(t + dur) }
  if (v.ring.gain > 0) for (const d of [-1, 1]) { const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = v.ring.freq * pitch; o.detune.value = d * v.ring.shimmer
    const g = ctx.createGain(); env(g, t, v.ring.gain * .5, .002, v.ring.decay); o.connect(g).connect(out); o.start(t); o.stop(t + v.ring.decay + .05) }
  if (v.thump.gain > 0) { const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(v.thump.from * pitch, t); o.frequency.exponentialRampToValueAtTime(Math.max(v.thump.to, 10), t + v.thump.decay)
    const g = ctx.createGain(); env(g, t, v.thump.gain, .002, v.thump.decay); o.connect(g).connect(out); o.start(t); o.stop(t + v.thump.decay + .05) }
}
function fire() { audio(); const G = GUNS[cur], t = ctx.currentTime + .01, n = G.burst || 1
  for (let i = 0; i < n; i++) shot(G.v, t + i * (G.burstGap || 0), 1 + (Math.random() - .5) * .06) }
function reload() { audio(); const t = ctx.currentTime + .01
  shot({ breath: { gain: 0 }, sizzle: { gain: 0 }, thump: { gain: 0 }, ring: { gain: .3, freq: 2400, shimmer: 3, decay: .08 } }, t)
  shot({ breath: { gain: 0 }, sizzle: { gain: 0 }, thump: { gain: 0 }, ring: { gain: .25, freq: 3000, shimmer: 3, decay: .07 } }, t + .09)
  const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.setValueAtTime(220, t + .2); o.frequency.exponentialRampToValueAtTime(520, t + .7)
  const g = ctx.createGain(); g.gain.setValueAtTime(.0001, t + .2); g.gain.exponentialRampToValueAtTime(.12, t + .35); g.gain.exponentialRampToValueAtTime(.0001, t + .75); o.connect(g).connect(master); o.start(t + .2); o.stop(t + .8) }
function empty() { audio(); const t = ctx.currentTime + .01
  for (let i = 0; i < 3; i++) shot({ breath: { gain: .18, freq: 3000, q: 3, attack: .001, decay: .02 }, sizzle: { gain: .1, freq: 7000, crackle: .6, decay: .03 }, ring: { gain: 0 }, thump: { gain: 0 } }, t + i * .05 + Math.random() * .02) }

// ── UI ──
const tabs = document.getElementById('tabs'), groups = document.getElementById('groups')
for (const id of Object.keys(GUNS)) { const b = document.createElement('button'); b.className = 'tab'; b.id = 'gun-' + id; b.textContent = GUNS[id].name; b.addEventListener('click', () => { cur = id; draw() }); tabs.append(b) }
function draw() {
  for (const b of tabs.children) b.setAttribute('aria-pressed', String(b.id === 'gun-' + cur))
  document.getElementById('desc').textContent = GUNS[cur].desc
  groups.innerHTML = ''
  for (const [lk, L] of Object.entries(LAYERS)) {
    const g = document.createElement('div'); g.className = 'group'
    g.innerHTML = `<div class="ghead"><span class="label">${L.name}</span><button data-solo="${lk}" style="padding:2px 8px;font-size:.75rem">Solo</button></div><p class="note" style="font-size:.78rem">${L.hint}</p>`
    for (const [pk, [min, max, step]] of Object.entries(L.p)) {
      const id = `p-${lk}-${pk}`, val = GUNS[cur].v[lk][pk]
      const row = document.createElement('label'); row.className = 'row'
      row.innerHTML = `<span>${pk}</span><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output for="${id}">${fmt(val)}</output>`
      const inp = row.querySelector('input'), o = row.querySelector('output')
      inp.addEventListener('input', () => { GUNS[cur].v[lk][pk] = +inp.value; o.textContent = fmt(+inp.value) })
      inp.addEventListener('change', fire)
      g.append(row)
    }
    g.querySelector('[data-solo]').addEventListener('click', () => { audio(); const v = JSON.parse(JSON.stringify(GUNS[cur].v)); for (const k of Object.keys(v)) if (k !== lk) v[k].gain = 0; shot(v, ctx.currentTime + .01) })
    groups.append(g)
  }
}
const fmt = v => (Math.abs(v) >= 100 ? Math.round(v) : Math.abs(v) >= 1 ? v.toFixed(1) : v.toFixed(3))
const pad = document.getElementById('fire'); let auto = null
pad.addEventListener('pointerdown', e => { e.preventDefault(); fire(); const r = GUNS[cur].rate; if (r) auto = setInterval(fire, 1000 / r) })
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) pad.addEventListener(ev, () => { clearInterval(auto); auto = null })
addEventListener('keydown', e => { if (e.code === 'Space' && !e.repeat && e.target.tagName !== 'INPUT') { e.preventDefault(); fire() } })
document.getElementById('reload').addEventListener('click', reload)
document.getElementById('empty').addEventListener('click', empty)
document.getElementById('reset').addEventListener('click', () => { GUNS[cur].v = JSON.parse(JSON.stringify(DEFAULTS[cur].v)); draw(); fire() })
const vol = document.getElementById('vol'); vol.addEventListener('input', () => { document.getElementById('volo').textContent = Math.round(vol.value * 100) + '%'; if (master) master.gain.value = +vol.value })
document.getElementById('copy').addEventListener('click', () => {
  const txt = JSON.stringify(Object.fromEntries(Object.entries(GUNS).map(([k, g]) => [k, g.v])))
  const out = document.getElementById('out'); out.hidden = false; out.value = txt
  const done = () => { document.getElementById('copy').textContent = 'Copied' ; setTimeout(() => document.getElementById('copy').textContent = 'Copy settings', 1400) }
  try { navigator.clipboard.writeText(txt).then(done, () => { out.select(); done() }) } catch { out.select(); done() }
})
draw()
</script>
